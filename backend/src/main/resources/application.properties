# ===== Server =====
server.port=8080

# ===== Database connection =====
# createDatabaseIfNotExist=true means MySQL will create the "insurance_db" database
# automatically the first time the app runs, so you don't have to create it manually.
spring.datasource.url=jdbc:mysql://localhost:3306/insurance_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sandesh123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
# "update" means Hibernate will auto-create/update tables based on your @Entity classes.
# This is fine for a student project. In real production systems, teams use migration
# tools (like Flyway/Liquibase) instead of ddl-auto, but that's beyond this project's scope.
spring.jpa.hibernate.ddl-auto=update

# Prints the actual SQL Hibernate runs in your terminal - very useful while learning/debugging.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
